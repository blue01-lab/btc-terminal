<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BTC Terminal</title>

<style>
body {
  background: black;
  color: #00ff00;
  font-family: monospace;
  text-align: center;
  padding-top: 50px;
}

h1 {
  font-size: 22px;
}

#price {
  font-size: 45px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>BITCOIN TERMINAL</h1>
<div>BTC / USD</div>
<div id="price">Loading...</div>

<script>
async function loadBTC() {
  try {
    const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");
    const data = await res.json();

    document.getElementById("price").innerText =
      "$" + parseFloat(data.price).toFixed(2);
  } catch (e) {
    document.getElementById("price").innerText = "NO DATA";
  }
}

loadBTC();
setInterval(loadBTC, 10000);
</script>

</body>
</html>
