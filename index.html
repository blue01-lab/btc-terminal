<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MINING DASHBOARD</title>

<style>
body {
  background: black;
  color: #00ff00;
  font-family: monospace;
  text-align: center;
  padding-top: 40px;
}

h1 {
  font-size: 18px;
  letter-spacing: 2px;
}

.box {
  border: 1px solid #00ff00;
  margin: 10px auto;
  padding: 10px;
  width: 80%;
}

.value {
  font-size: 28px;
}
</style>
</head>

<body>

<h1>MINING CONTROL PANEL</h1>

<div class="box">
BTC PRICE<br>
<div class="value" id="btc">$---</div>
</div>

<div class="box">
HASHRATE<br>
<div class="value" id="hash">-- TH/s</div>
</div>

<div class="box">
TEMP<br>
<div class="value" id="temp">-- °C</div>
</div>

<div class="box">
STATUS<br>
<div id="status">OFFLINE</div>
</div>

<script>
async function load() {
  try {
    const res = await fetch("data.json?nocache=" + Date.now());
    const d = await res.json();

    document.getElementById("btc").innerText = "$" + d.btc;
    document.getElementById("hash").innerText = d.hashrate + " TH/s";
    document.getElementById("temp").innerText = d.temp + " °C";
    document.getElementById("status").innerText = d.status;
  } catch (e) {
    document.getElementById("status").innerText = "NO DATA";
  }
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
