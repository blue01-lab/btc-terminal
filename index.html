<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BTC Terminal</title>

<style>
body {
  background: black;
  color: #00ff00;
  font-family: monospace;
  text-align: center;
  padding-top: 50px;
}

h1 {
  font-size: 22px;
}

#price {
  font-size: 45px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>BITCOIN TERMINAL</h1>
<div>BTC / USD</div>
<div id="price">Loading...</div>

<script>
function loadBTC() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", true);

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var data = JSON.parse(xhr.responseText);
        document.getElementById("price").innerText =
          "$" + parseFloat(data.price).toFixed(2);
      } else {
        document.getElementById("price").innerText = "NO DATA";
      }
    }
  };

  xhr.send();
}

loadBTC();
setInterval(loadBTC, 10000);
</script>

</body>
</html>
